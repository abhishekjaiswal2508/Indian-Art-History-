<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="guptaAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFDD80" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E0A23A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="buffSandstone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECD7A8"/>
      <stop offset="50%" stop-color="#D4B679"/>
      <stop offset="100%" stop-color="#A68344"/>
    </linearGradient>
    <filter id="buddhaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2A44" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#guptaAura)"/>

  <!-- Ornate Gupta Prabhamandala (Carved Halo) behind head -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="82" fill="#E8D5A7" stroke="#9C7735" stroke-width="2"/>
    <circle cx="0" cy="0" r="76" stroke="#9C7735" stroke-width="1.2" stroke-dasharray="3 3"/>
    
    <!-- Concentric band of lotus petals -->
    <circle cx="0" cy="0" r="62" stroke="#9C7735" stroke-width="1.5" fill="none"/>
    <g stroke="#9C7735" stroke-width="1.2" fill="#E3C994">
      <path d="M0 -62 Q-6 -70 0 -76 Q6 -70 0 -62 Z"/>
      <path d="M0 62 Q-6 70 0 76 Q6 70 0 62 Z"/>
      <path d="M-62 0 Q-70 -6 -76 0 Q-70 6 -62 0 Z"/>
      <path d="M62 0 Q70 -6 76 0 Q70 6 62 0 Z"/>
      <path d="M-44 -44 Q-52 -48 -54 -54 Q-48 -52 -44 -44 Z"/>
      <path d="M44 -44 Q52 -48 54 -54 Q48 -52 44 -44 Z"/>
      <path d="M-44 44 Q-52 48 -54 54 Q-48 52 -44 44 Z"/>
      <path d="M44 44 Q52 48 54 54 Q48 52 44 44 Z"/>
    </g>

    <!-- Celestial Gandharva figures hovering on halo edges -->
    <path d="M-65 -45 C-80 -55 -75 -70 -60 -65 C-55 -60 -50 -55 -65 -45 Z" fill="#9C7735" opacity="0.7"/>
    <path d="M65 -45 C80 -55 75 -70 60 -65 C55 -60 50 -55 65 -45 Z" fill="#9C7735" opacity="0.7"/>
    <circle cx="0" cy="0" r="48" fill="#F0E0B8" stroke="#9C7735" stroke-width="1.5"/>
  </g>

  <!-- STANDING BUDDHA FIGURE -->
  <g filter="url(#buddhaShadow)">
    <!-- Lotus Pedestal Base -->
    <ellipse cx="200" cy="346" rx="60" ry="12" fill="#D4B679" stroke="#9C7735" stroke-width="1.5"/>
    <g fill="#ECD7A8" stroke="#9C7735" stroke-width="1">
      <path d="M150 346 C158 340 168 340 176 346 Z"/>
      <path d="M176 346 C184 340 194 340 202 346 Z"/>
      <path d="M202 346 C210 340 220 340 228 346 Z"/>
      <path d="M228 346 C236 340 244 340 250 346 Z"/>
    </g>

    <!-- Feet on Lotus -->
    <ellipse cx="190" cy="338" rx="8" ry="4" fill="url(#buffSandstone)"/>
    <ellipse cx="210" cy="338" rx="8" ry="4" fill="url(#buffSandstone)"/>

    <!-- Robe & Body (Idealized Gupta form, sheer diaphanous drapery) -->
    <!-- Lower Robe / Antaravasaka hemline -->
    <path d="M175 330 C185 334 215 334 225 330 L228 318 C215 322 185 322 172 318 Z" fill="#ECD7A8" stroke="#9C7735" stroke-width="1"/>

    <!-- Sanghati Outer Robe & Legs -->
    <path d="M168 185 C162 230 165 285 174 324 C190 327 210 327 226 324 C235 285 238 230 232 185 Z" 
          fill="url(#buffSandstone)" stroke="#9C7735" stroke-width="1.2"/>
    
    <!-- Delicate rippling hem folds (Gupta string drapery) -->
    <path d="M172 205 C185 212 215 212 228 205" stroke="#9C7735" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M170 230 C185 238 215 238 230 230" stroke="#9C7735" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M170 255 C185 264 215 264 230 255" stroke="#9C7735" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M171 280 C185 290 215 290 229 280" stroke="#9C7735" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M172 305 C185 315 215 315 228 305" stroke="#9C7735" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Torso and Shoulders (Lion-like broad torso / simha-kaya) -->
    <path d="M162 145 C156 165 160 185 168 190 C175 192 225 192 232 190 C240 185 244 165 238 145 Z" 
          fill="url(#buffSandstone)"/>

    <!-- Left Arm & Hand holding the pleated robe corner -->
    <path d="M164 148 C150 170 152 205 162 230" stroke="url(#buffSandstone)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Left hand clutching gathering folds -->
    <circle cx="163" cy="232" r="6" fill="#D4B679" stroke="#9C7735" stroke-width="1"/>
    <!-- Falling gathered pleat frills -->
    <path d="M160 238 L154 285 L164 280 L158 240" fill="#ECD7A8" stroke="#9C7735" stroke-width="1"/>

    <!-- Right Arm & Hand in ABHAYA MUDRA (Gesture of reassurance / no fear) -->
    <path d="M236 148 C246 168 248 195 242 215" stroke="url(#buffSandstone)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Forearm raised in blessing -->
    <path d="M242 215 L244 195" stroke="url(#buffSandstone)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Upraised palm facing viewer -->
    <g transform="translate(244, 185)">
      <ellipse cx="4" cy="4" rx="7" ry="9" fill="#ECD7A8" stroke="#9C7735" stroke-width="1.2"/>
      <!-- Fingers pointing up -->
      <path d="M0 -3 L0 -10 M3 -4 L3 -12 M6 -4 L6 -11 M9 -3 L9 -9" stroke="#9C7735" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Wheel/lotus mark on palm (Mahapurusha lakshana) -->
      <circle cx="4" cy="4" r="2.2" fill="#9C7735"/>
    </g>

    <!-- Head & Neck -->
    <!-- Triple neck lines (conch neck / kambu-griva) -->
    <path d="M192 142 Q200 145 208 142" stroke="#9C7735" stroke-width="1.5" fill="none"/>
    
    <!-- Face (Oval, smooth, transcendent peace) -->
    <path d="M185 102 C182 125 188 140 200 140 C212 140 218 125 215 102 C212 85 188 85 185 102 Z" 
          fill="url(#buffSandstone)" stroke="#9C7735" stroke-width="1.2"/>

    <!-- Elongated earlobes -->
    <path d="M183 108 C180 114 180 128 184 130 C186 130 185 118 185 112" stroke="#9C7735" stroke-width="1.8" fill="none"/>
    <path d="M217 108 C220 114 220 128 216 130 C214 130 215 118 215 112" stroke="#9C7735" stroke-width="1.8" fill="none"/>

    <!-- Eyes (Half-closed, looking inward in deep samadhi) -->
    <path d="M188 112 Q193 116 197 113" stroke="#5E4012" stroke-width="1.6" fill="none"/>
    <path d="M203 113 Q207 116 212 112" stroke="#5E4012" stroke-width="1.6" fill="none"/>
    <!-- Unbroken bow eyebrows -->
    <path d="M186 108 Q194 104 200 108 Q206 104 214 108" stroke="#5E4012" stroke-width="1.4" fill="none"/>
    
    <!-- Urna circle on forehead -->
    <circle cx="200" cy="103" r="1.5" fill="#5E4012"/>

    <!-- Nose & Serene Smile -->
    <path d="M200 108 L199 122 L202 123" stroke="#5E4012" stroke-width="1.4" fill="none"/>
    <path d="M195 129 Q200 133 205 129" stroke="#5E4012" stroke-width="1.6" fill="none"/>

    <!-- Ushnisha (Cranial bump of cosmic wisdom) & Snail-shell hair curls -->
    <ellipse cx="200" cy="85" rx="10" ry="8" fill="#75521C"/>
    <!-- Tight right-turning curly curls covering head -->
    <g fill="#75521C">
      <circle cx="190" cy="94" r="2.5"/><circle cx="195" cy="92" r="2.5"/><circle cx="200" cy="91" r="2.5"/><circle cx="205" cy="92" r="2.5"/><circle cx="210" cy="94" r="2.5"/>
      <circle cx="187" cy="99" r="2.5"/><circle cx="213" cy="99" r="2.5"/>
      <circle cx="194" cy="86" r="2.5"/><circle cx="200" cy="84" r="2.5"/><circle cx="206" cy="86" r="2.5"/>
      <circle cx="200" cy="79" r="2.5"/>
    </g>
  </g>

  <!-- Era Label -->
  <text x="200" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E0A23A" text-anchor="middle" letter-spacing="1.5">GUPTA EMPIRE · 5th CENTURY CE</text>
</svg>
