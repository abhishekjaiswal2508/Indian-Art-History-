<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C65D3B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6544"/>
      <stop offset="35%" stop-color="#5E3F27"/>
      <stop offset="70%" stop-color="#422918"/>
      <stop offset="100%" stop-color="#2B1A0E"/>
    </linearGradient>
    <linearGradient id="patinaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#557B6B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2D4A3E" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2A44" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background aura -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGlow1)"/>
  <circle cx="200" cy="200" r="160" stroke="#C65D3B" stroke-width="1" stroke-dasharray="3 5" opacity="0.3"/>

  <!-- Museum Plinth -->
  <ellipse cx="200" cy="355" rx="75" ry="14" fill="#E8DEC8" stroke="#D1C3A5" stroke-width="2"/>
  <ellipse cx="200" cy="358" rx="60" ry="8" fill="#1F2A44" opacity="0.12"/>

  <!-- Dancing Girl Lost-Wax Bronze Figurine -->
  <g filter="url(#softShadow)">
    <!-- Right Arm (Resting hand on right hip) -->
    <path d="M190 148 C165 158 150 178 152 205 C153 218 165 218 178 212" 
          fill="none" stroke="url(#bronzeGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right wrist bangles (few) -->
    <circle cx="166" cy="211" r="5" fill="#E0A23A" opacity="0.7"/>
    <circle cx="169" cy="212" r="5" fill="#C65D3B" opacity="0.7"/>

    <!-- Left Leg (Slightly forward, weight shifted) -->
    <path d="M208 245 C212 275 214 315 216 348" 
          fill="none" stroke="url(#bronzeGrad)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="217" cy="350" rx="9" ry="4" fill="url(#bronzeGrad)"/>

    <!-- Right Leg (Back leg) -->
    <path d="M192 245 C190 275 186 315 184 348" 
          fill="none" stroke="url(#bronzeGrad)" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="183" cy="350" rx="8" ry="4" fill="url(#bronzeGrad)"/>

    <!-- Torso (Slender, graceful elongated form, slight sway) -->
    <path d="M188 135 C186 165 180 195 182 225 C183 238 212 238 214 225 C215 195 212 165 208 135 Z" 
          fill="url(#bronzeGrad)"/>

    <!-- Patina sheen highlight -->
    <path d="M190 150 C188 180 184 205 186 220" 
          stroke="url(#patinaGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Left Arm (Loaded with stacked bangles from shoulder to wrist) -->
    <path d="M210 146 C232 170 236 195 220 235" 
          fill="none" stroke="url(#bronzeGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Iconic full-arm bangles on left arm -->
    <g stroke="#D4A76A" stroke-width="2.5" fill="none">
      <line x1="211" y1="152" x2="218" y2="157"/>
      <line x1="214" y1="158" x2="222" y2="164"/>
      <line x1="218" y1="165" x2="226" y2="171"/>
      <line x1="222" y1="172" x2="229" y2="178"/>
      <line x1="225" y1="179" x2="232" y2="185"/>
      <line x1="227" y1="187" x2="233" y2="194"/>
      <line x1="227" y1="195" x2="232" y2="202"/>
      <line x1="225" y1="203" x2="230" y2="210"/>
      <line x1="222" y1="211" x2="226" y2="218"/>
      <line x1="218" y1="220" x2="221" y2="227"/>
    </g>

    <!-- Left hand resting on upper thigh -->
    <ellipse cx="218" cy="235" rx="6" ry="5" fill="url(#bronzeGrad)"/>

    <!-- Neck & Necklace -->
    <path d="M193 118 L194 135 L204 135 L203 118 Z" fill="url(#bronzeGrad)"/>
    <!-- Triple amulet necklace -->
    <path d="M192 130 Q199 137 205 130" stroke="#E0A23A" stroke-width="2.5" fill="none"/>
    <circle cx="195" cy="135" r="2" fill="#E0A23A"/>
    <circle cx="198.5" cy="136" r="2.2" fill="#E0A23A"/>
    <circle cx="202" cy="135" r="2" fill="#E0A23A"/>

    <!-- Head & Distinctive Mohenjo-daro Bun -->
    <!-- Large voluminous hair bun tied on right-rear -->
    <ellipse cx="216" cy="104" rx="14" ry="12" fill="url(#bronzeGrad)"/>
    <ellipse cx="216" cy="104" rx="11" ry="9" stroke="#3D291C" stroke-width="1.5" fill="none"/>

    <!-- Face (tilted back slightly, proud gaze) -->
    <path d="M191 102 C189 114 195 124 202 124 C208 124 211 114 209 102 C206 94 194 94 191 102 Z" 
          fill="url(#bronzeGrad)"/>
    <!-- Facial profile details (stylized) -->
    <ellipse cx="193" cy="106" rx="2" ry="3.5" fill="#3D291C"/>
    <path d="M189 110 C187 113 189 115 192 115" stroke="#3D291C" stroke-width="1.5" fill="none"/>
    <path d="M192 119 C195 120 198 120 200 119" stroke="#3D291C" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Era & Artifact label tag -->
  <text x="200" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C65D3B" text-anchor="middle" letter-spacing="1.5">INDUS VALLEY · c. 2500 BCE</text>
</svg>
