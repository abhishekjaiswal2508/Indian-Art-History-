<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="washAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FAD7A0" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#EDBB99" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saffronRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8C471"/>
      <stop offset="50%" stop-color="#EB984E"/>
      <stop offset="100%" stop-color="#CA6F1E"/>
    </linearGradient>
    <linearGradient id="washBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8DAEF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FCF3CF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EDBB99" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="bengalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2A44" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#washAura)"/>

  <!-- BENGAL SCHOOL WASH-TECHNIQUE PAPER BASE -->
  <g filter="url(#bengalShadow)">
    <rect x="50" y="30" width="300" height="325" rx="4" fill="#FAF6EF" stroke="#CA6F1E" stroke-width="1.2"/>
    <rect x="55" y="35" width="290" height="315" fill="url(#washBg)"/>

    <!-- Luminous Ethereal Halo (Translucent Wash) -->
    <circle cx="200" cy="120" r="55" fill="#FEF9E7" fill-opacity="0.8" stroke="#F8C471" stroke-width="1.5"/>
    <circle cx="200" cy="120" r="48" stroke="#F5B041" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

    <!-- BLOOMING LOTUSES AT HER FEET -->
    <g transform="translate(200, 318)">
      <!-- Lotus 1 Left -->
      <path d="M-40 0 C-50 -15 -35 -25 -25 -10 C-20 -20 -10 -20 -10 -8" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
      <ellipse cx="-25" cy="2" rx="18" ry="5" fill="#82E0AA"/>
      <!-- Lotus 2 Right -->
      <path d="M20 -8 C20 -20 30 -20 35 -10 C45 -25 60 -15 50 0" fill="#FADBD8" stroke="#E74C3C" stroke-width="1"/>
      <ellipse cx="35" cy="2" rx="18" ry="5" fill="#82E0AA"/>
      <!-- Center Lotus -->
      <path d="M-15 0 C-20 -18 0 -24 0 -10 C0 -24 20 -18 15 0" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.2"/>
    </g>

    <!-- MOTHER INDIA (ASCETIC SANYASINI IN SAFFRON) -->
    <!-- Lower Saffron Saree Folds (Flowing ascetic garments) -->
    <path d="M172 190 C162 230 155 280 165 315 C185 318 215 318 235 315 C245 280 238 230 228 190 Z" 
          fill="url(#saffronRobe)" stroke="#BA4A00" stroke-width="1"/>
    <!-- Gentle wash drape lines -->
    <path d="M185 205 C180 240 178 280 184 314" stroke="#BA4A00" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M200 200 C198 240 196 280 200 315" stroke="#BA4A00" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M215 205 C218 240 220 280 216 314" stroke="#BA4A00" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Ascetic Robe wrapped across chest -->
    <path d="M180 145 C170 165 172 185 178 195 C190 198 210 198 222 195 C228 185 230 165 220 145 Z" fill="url(#saffronRobe)"/>
    <path d="M182 148 L220 188" stroke="#BA4A00" stroke-width="1.5" opacity="0.7"/>

    <!-- FOUR DIVINE ARMS & SACRED EMBLEMS OF SELF-RELIANCE -->
    <!-- 1. Upper Right Hand: VEDAS (Book of Knowledge / Shiksha) -->
    <path d="M178 155 C155 152 140 165 132 180" stroke="#F5CBA7" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Ancient Palm-Leaf Manuscript / Pustaka -->
    <g transform="translate(118, 172) rotate(-15)">
      <rect x="0" y="0" width="22" height="12" rx="1.5" fill="#FAF6EF" stroke="#7D6608" stroke-width="1"/>
      <line x1="3" y1="4" x2="19" y2="4" stroke="#CA6F1E" stroke-width="0.8"/>
      <line x1="3" y1="8" x2="19" y2="8" stroke="#CA6F1E" stroke-width="0.8"/>
    </g>

    <!-- 2. Lower Right Hand: JAPA MALA (Prayer Beads / Spiritual Wisdom / Diksha) -->
    <path d="M182 175 C165 190 155 210 150 225" stroke="#F5CBA7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- String of Rudraksha / Pearl prayer beads -->
    <ellipse cx="146" cy="235" rx="6" ry="12" stroke="#7D6608" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
    <circle cx="146" cy="247" r="2" fill="#BA4A00"/>

    <!-- 3. Upper Left Hand: SHEAF OF PADDY (Ripened Golden Rice / Anna) -->
    <path d="M222 155 C245 152 260 165 268 180" stroke="#F5CBA7" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Golden grain stalk (Paddy stalks) -->
    <g transform="translate(265, 165) rotate(20)">
      <path d="M0 25 C8 15 15 5 18 -10" stroke="#27AE60" stroke-width="1.5" fill="none"/>
      <!-- Golden grain spikes -->
      <g fill="#F1C40F" stroke="#B7950B" stroke-width="0.6">
        <ellipse cx="8" cy="18" rx="3.5" ry="2"/>
        <ellipse cx="12" cy="12" rx="3.5" ry="2"/>
        <ellipse cx="15" cy="5" rx="3.5" ry="2"/>
        <ellipse cx="17" cy="-2" rx="3.5" ry="2"/>
        <ellipse cx="18" cy="-10" rx="3.5" ry="2"/>
      </g>
    </g>

    <!-- 4. Lower Left Hand: WHITE CLOTH (Khadi Swadeshi Garment / Vastra) -->
    <path d="M218 175 C235 190 245 210 248 225" stroke="#F5CBA7" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <!-- Pure folded white fabric bolt -->
    <g transform="translate(244, 222)">
      <rect x="0" y="0" width="16" height="22" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
      <line x1="0" y1="7" x2="16" y2="7" stroke="#BDC3C7" stroke-width="0.8"/>
      <line x1="0" y1="14" x2="16" y2="14" stroke="#BDC3C7" stroke-width="0.8"/>
    </g>

    <!-- HEAD & COUNTENANCE (SERENE COMPASSIONATE MOTHER) -->
    <circle cx="200" cy="118" r="14" fill="#F5CBA7"/>
    <!-- Flowing ascetic dark hair parted in middle -->
    <path d="M188 116 C186 100 214 100 212 116 C206 106 194 106 188 116 Z" fill="#2C3E50"/>
    <path d="M188 116 C186 130 188 142 192 146" stroke="#2C3E50" stroke-width="2.5" fill="none"/>
    <path d="M212 116 C214 130 212 142 208 146" stroke="#2C3E50" stroke-width="2.5" fill="none"/>

    <!-- Soft, meditative, compassionate eyes -->
    <path d="M193 118 Q196 122 199 119" stroke="#5D4037" stroke-width="1.2" fill="none"/>
    <path d="M201 119 Q204 122 207 118" stroke="#5D4037" stroke-width="1.2" fill="none"/>
    <!-- Small tilak of ascetic grace -->
    <circle cx="200" cy="112" r="1" fill="#CA6F1E"/>
    <!-- Gentle lips -->
    <path d="M197 126 Q200 128 203 126" stroke="#922B21" stroke-width="1" fill="none"/>
  </g>

  <!-- Era Label -->
  <text x="200" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2F6F6B" text-anchor="middle" letter-spacing="1.5">BENGAL SCHOOL · 1905 CE</text>
</svg>
