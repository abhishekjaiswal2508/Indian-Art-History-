<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="padmaGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0A23A" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#2F6F6B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C382"/>
      <stop offset="50%" stop-color="#D99B52"/>
      <stop offset="100%" stop-color="#A66724"/>
    </linearGradient>
    <linearGradient id="lapisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B86E5"/>
      <stop offset="50%" stop-color="#36D1DC"/>
      <stop offset="100%" stop-color="#1F4287"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C68928"/>
      <stop offset="50%" stop-color="#FFDE72"/>
      <stop offset="100%" stop-color="#8F5C12"/>
    </linearGradient>
    <filter id="frescoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1F2A44" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Fresco aura -->
  <circle cx="200" cy="200" r="185" fill="url(#padmaGlow)"/>
  
  <!-- Ajanta Cave rock wall background motif -->
  <rect x="35" y="35" width="330" height="330" rx="20" fill="#E8DEC8" opacity="0.35"/>
  <rect x="40" y="40" width="320" height="320" rx="16" stroke="#C65D3B" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.4"/>

  <!-- Halo (Prabhamandala) behind Padmapani -->
  <circle cx="195" cy="130" r="80" fill="#D9822B" fill-opacity="0.25" stroke="#E0A23A" stroke-width="2"/>
  <circle cx="195" cy="130" r="74" stroke="#FAF6EF" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.6"/>

  <g filter="url(#frescoShadow)">
    <!-- Shoulders & Torso in Tribhanga sway -->
    <path d="M110 330 C120 250 145 220 160 200 C165 190 225 185 245 205 C260 220 280 250 285 330 Z" 
          fill="url(#skinTone)"/>
    
    <!-- Sacred Thread (Yajnopavita) of pearls crossing chest -->
    <path d="M165 205 C175 240 185 285 225 330" stroke="#FAF6EF" stroke-width="2.5" stroke-dasharray="3 3" fill="none"/>
    <path d="M164 207 C174 242 184 287 224 332" stroke="#DCA245" stroke-width="1" fill="none"/>

    <!-- Pearl & Emerald Necklaces -->
    <path d="M172 188 C185 205 210 205 222 188" stroke="#FAF6EF" stroke-width="3" stroke-dasharray="4 2" fill="none"/>
    <circle cx="197" cy="202" r="4.5" fill="#2F6F6B" stroke="#E0A23A" stroke-width="1"/>
    
    <!-- Gentle neck folds (griva-rekhas, classical sign of beauty) -->
    <path d="M182 172 Q197 176 212 172" stroke="#8F591E" stroke-width="1.2" fill="none"/>
    <path d="M185 178 Q197 182 209 178" stroke="#8F591E" stroke-width="1.2" fill="none"/>

    <!-- Head & Face (tilted gently to right shoulder) -->
    <path d="M170 115 C168 155 182 175 198 175 C216 175 226 155 224 115 C222 85 172 85 170 115 Z" 
          fill="url(#skinTone)"/>

    <!-- Delicate elongated ears with heavy jewelled earplugs (kundalas) -->
    <path d="M168 122 C164 125 163 145 167 150 C170 152 171 140 170 130" stroke="#8F591E" stroke-width="2" fill="none"/>
    <circle cx="166" cy="151" r="4.5" fill="#E0A23A" stroke="#8F591E" stroke-width="1"/>
    <path d="M226 122 C230 125 231 145 227 150 C224 152 223 140 224 130" stroke="#8F591E" stroke-width="2" fill="none"/>
    <circle cx="228" cy="151" r="4.5" fill="#E0A23A" stroke="#8F591E" stroke-width="1"/>

    <!-- Iconic Eyebrows (bow-like arched lines meeting above nose bridge) -->
    <path d="M178 122 Q188 116 195 123" stroke="#3D200E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M201 123 Q208 116 218 122" stroke="#3D200E" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Half-closed, meditative lotus-petal eyes (padmapalashakshi) looking downward -->
    <g fill="#FAF6EF" stroke="#3D200E" stroke-width="1.5">
      <path d="M179 127 C184 124 191 126 194 130 C190 131 183 130 179 127 Z"/>
      <circle cx="187" cy="128" r="2" fill="#261C14"/>
      <path d="M202 130 C205 126 212 124 217 127 C213 130 206 131 202 130 Z"/>
      <circle cx="209" cy="128" r="2" fill="#261C14"/>
    </g>

    <!-- Aquiline Nose & Gentle Compassionate Lips -->
    <path d="M196 123 L195 142 L199 143" stroke="#8F591E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Lips in gentle smile -->
    <path d="M189 152 Q197 149 205 152" stroke="#B83A2E" stroke-width="2" fill="none"/>
    <path d="M190 153 Q197 158 204 153" stroke="#B83A2E" stroke-width="1.5" fill="#D95B4E"/>

    <!-- THE TOWERING JEWELLED CROWN (KIRITA MUKUTA) -->
    <path d="M172 105 L166 60 L200 42 L230 60 L224 105 Z" fill="url(#crownGold)" stroke="#663E10" stroke-width="1.5"/>
    <!-- Sapphire and ruby cabochons on crown -->
    <circle cx="198" cy="72" r="7" fill="url(#lapisGrad)" stroke="#FFE89E" stroke-width="1.5"/>
    <circle cx="180" cy="78" r="4.5" fill="#B83A2E"/>
    <circle cx="216" cy="78" r="4.5" fill="#B83A2E"/>
    <!-- Pearl circlets on crown base -->
    <line x1="170" y1="102" x2="226" y2="102" stroke="#FAF6EF" stroke-width="3" stroke-dasharray="3 2"/>

    <!-- RIGHT HAND HOLDING SACRED BLUE LOTUS (NILOTPALA) -->
    <!-- Arm extending into foreground -->
    <path d="M245 205 C265 240 270 275 255 305" stroke="url(#skinTone)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Armband (Keyura) -->
    <circle cx="254" cy="235" r="7" fill="#E0A23A" stroke="#8F591E" stroke-width="1"/>

    <!-- Slender elegant fingers holding lotus stem -->
    <g transform="translate(250, 275)">
      <!-- Long sinuous lotus stalk -->
      <path d="M8 30 C12 0 16 -30 20 -70" stroke="#2F6F6B" stroke-width="3" fill="none" stroke-linecap="round"/>
      
      <!-- THE BLUE LOTUS BLOOM (PADMA) -->
      <g transform="translate(20, -75)" filter="url(#frescoShadow)">
        <path d="M0 0 C-15 -10 -20 -30 0 -45 C20 -30 15 -10 0 0 Z" fill="url(#lapisGrad)"/>
        <path d="M-8 -15 C-25 -25 -25 -45 -5 -50 C-2 -35 0 -20 -8 -15 Z" fill="#4A75D0"/>
        <path d="M8 -15 C25 -25 25 -45 5 -50 C2 -35 0 -20 8 -15 Z" fill="#7FA9F5"/>
        <path d="M0 -15 C-6 -30 0 -50 0 -55 C0 -50 6 -30 0 -15 Z" fill="#A8D0FF"/>
        <!-- Golden stamen center -->
        <circle cx="0" cy="-25" r="3" fill="#FFE89E"/>
      </g>

      <!-- Graceful mudra fingers encircling the stalk -->
      <path d="M0 10 Q12 8 16 18 Q8 22 2 16" fill="url(#skinTone)" stroke="#8F591E" stroke-width="1"/>
      <path d="M5 2 Q18 2 20 12 Q14 15 6 8" fill="url(#skinTone)" stroke="#8F591E" stroke-width="1"/>
    </g>
  </g>

  <!-- Era Label -->
  <text x="200" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2F6F6B" text-anchor="middle" letter-spacing="1.5">AJANTA CAVE 1 · c. 5th CENTURY CE</text>
</svg>
