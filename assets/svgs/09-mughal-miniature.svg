<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mughalAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#E5B242" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lapisSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143265"/>
      <stop offset="40%" stop-color="#1E4D94"/>
      <stop offset="100%" stop-color="#EAE3D2"/>
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE08A"/>
      <stop offset="50%" stop-color="#D4A036"/>
      <stop offset="100%" stop-color="#9C6B14"/>
    </linearGradient>
    <filter id="folioShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2A44" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="185" fill="url(#mughalAura)"/>

  <!-- ILLUMINATED FOLIO PAGE (ALBUM PAGE / MURAQQA) -->
  <g filter="url(#folioShadow)">
    <!-- Wasli Paper Margins -->
    <rect x="45" y="25" width="310" height="330" rx="6" fill="#F4EDE0" stroke="#8C6544" stroke-width="1.5"/>

    <!-- Gold Arabesque Flecked Border (Hashiya) -->
    <rect x="55" y="35" width="290" height="310" rx="3" fill="#FAF7F2" stroke="url(#goldLeaf)" stroke-width="3"/>
    <!-- Decorative vine motifs in border -->
    <rect x="62" y="42" width="276" height="296" fill="none" stroke="#23496D" stroke-width="0.8"/>
    <g stroke="url(#goldLeaf)" stroke-width="1.5" fill="none" opacity="0.75">
      <path d="M70 50 Q100 45 130 50 Q160 55 190 50 Q220 45 250 50 Q280 55 310 50 Q330 48 330 70"/>
      <path d="M70 330 Q100 325 130 330 Q160 335 190 330 Q220 325 250 330 Q280 335 310 330 Q330 328 330 310"/>
      <circle cx="90" cy="48" r="2.5" fill="#C63D2F"/>
      <circle cx="150" cy="52" r="2.5" fill="#237A57"/>
      <circle cx="210" cy="48" r="2.5" fill="#C63D2F"/>
      <circle cx="270" cy="52" r="2.5" fill="#237A57"/>
    </g>

    <!-- INNER MINIATURE PAINTING WINDOW -->
    <rect x="75" y="55" width="250" height="270" fill="url(#lapisSky)" stroke="#8C2518" stroke-width="2"/>

    <!-- Golden rolling horizon & Persian clouds (Simbhar) -->
    <path d="M75 140 C120 125 180 150 240 135 C280 125 310 140 325 135 L325 220 L75 220 Z" fill="#D3BA7C"/>
    <!-- Swirling stylized clouds -->
    <path d="M120 75 Q135 65 150 75 Q165 85 180 75" stroke="#FAF6EF" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M230 85 Q245 75 260 85 Q275 95 290 85" stroke="#FAF6EF" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Slender Cypress Trees (Classic Mughal motif) -->
    <path d="M98 220 C96 170 94 135 102 100 C110 135 108 170 106 220 Z" fill="#1C5E3D" stroke="#0F3824" stroke-width="1"/>
    <path d="M302 220 C300 170 298 135 306 100 C314 135 312 170 310 220 Z" fill="#1C5E3D" stroke="#0F3824" stroke-width="1"/>
    <!-- Flowering Almond Blossoms -->
    <g fill="#FAF6EF" stroke="#C63D2F" stroke-width="0.5">
      <circle cx="112" cy="120" r="2.5"/><circle cx="118" cy="112" r="2.5"/><circle cx="114" cy="132" r="2.5"/>
      <circle cx="292" cy="120" r="2.5"/><circle cx="286" cy="112" r="2.5"/><circle cx="290" cy="132" r="2.5"/>
    </g>

    <!-- MARBLE GARDEN PAVILION (BARADARI) -->
    <!-- Cusped Arch Pavilion -->
    <rect x="135" y="125" width="130" height="135" fill="#FAF6EF" stroke="#8C6544" stroke-width="1.2"/>
    <!-- Persian Dome above pavilion -->
    <path d="M170 125 C170 95 200 80 200 80 C200 80 230 95 230 125 Z" fill="url(#goldLeaf)" stroke="#8C6544" stroke-width="1.2"/>
    <line x1="200" y1="80" x2="200" y2="70" stroke="#8C6544" stroke-width="2"/>
    <circle cx="200" cy="68" r="3" fill="#C63D2F"/>

    <!-- Multi-lobed Cusped Arch Opening -->
    <path d="M152 260 L152 175 C152 155 168 150 180 156 C190 148 210 148 220 156 C232 150 248 155 248 175 L248 260 Z" 
          fill="#EFE7D8" stroke="#8C2518" stroke-width="1.5"/>

    <!-- Inlaid Persian Carpet (Floor) -->
    <polygon points="120,260 280,260 300,320 100,320" fill="#9C2718" stroke="#E5B242" stroke-width="1.5"/>
    <g stroke="#E5B242" stroke-width="1" fill="none">
      <polygon points="135,268 265,268 280,312 120,312"/>
      <ellipse cx="200" cy="290" rx="30" ry="12" fill="#143265" stroke="#E5B242" stroke-width="1.2"/>
    </g>

    <!-- ROYAL FIGURE / EMPEROR IN PROFILE (Jahangir / Akbar iconography) -->
    <!-- Halo of Divine Light (Nur) behind royal head -->
    <circle cx="195" cy="182" r="16" fill="url(#goldLeaf)" opacity="0.9"/>

    <!-- Throne / Musnad bolster -->
    <ellipse cx="218" cy="235" rx="14" ry="18" fill="#1C5E3D" stroke="#E5B242" stroke-width="1.2"/>
    
    <!-- Robe (Jama) in saffron orange -->
    <path d="M182 198 C175 220 178 245 185 255 L215 255 C222 245 225 220 216 198 Z" fill="#E8823A"/>
    <!-- Patka (Embroidered Sash) -->
    <path d="M190 225 L210 225 L208 252 L192 252 Z" fill="#FAF6EF" stroke="#C63D2F" stroke-width="1"/>

    <!-- Turban (Pagri) with jewelled Sarpech (feather aigrette) -->
    <ellipse cx="196" cy="178" rx="8" ry="6" fill="#C63D2F"/>
    <path d="M190 174 Q196 168 202 174" stroke="#E5B242" stroke-width="2" fill="none"/>
    <!-- Black Heron Feather Aigrette -->
    <path d="M200 172 Q206 160 204 154" stroke="#1F2A44" stroke-width="1.8" fill="none"/>

    <!-- Profile Face & Hand Holding a Rose / Jewel -->
    <ellipse cx="195" cy="183" rx="5" ry="6" fill="#F4EDE0"/>
    <path d="M190 183 L186 185 L188 187" stroke="#8C6544" stroke-width="1" fill="none"/>
    <ellipse cx="189" cy="182" rx="1" ry="1.2" fill="#1F2A44"/>
    <!-- Hand holding red flower -->
    <circle cx="178" cy="205" r="3.5" fill="#C63D2F"/>
    <line x1="178" y1="208" x2="182" y2="215" stroke="#1C5E3D" stroke-width="1.5"/>
  </g>

  <!-- Era Label -->
  <text x="200" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#23496D" text-anchor="middle" letter-spacing="1.5">MUGHAL EMPIRE · 16th CENTURY</text>
</svg>
