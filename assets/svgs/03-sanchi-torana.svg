<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0A23A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FAF6EF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sandstone3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B770"/>
      <stop offset="50%" stop-color="#BA8741"/>
      <stop offset="100%" stop-color="#80541E"/>
    </linearGradient>
    <filter id="toranaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1F2A44" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="180" fill="url(#bgGlow3)"/>
  <circle cx="200" cy="200" r="165" stroke="#E0A23A" stroke-width="1" stroke-dasharray="2 4" opacity="0.35"/>

  <!-- Sanchi Stupa Dome Silhouette in background -->
  <path d="M120 345 C120 220 280 220 280 345 Z" fill="#E8DEC8" opacity="0.45"/>
  <!-- Harmika & Chhatra (umbrella spire) on top of stupa dome in background -->
  <rect x="190" y="210" width="20" height="12" fill="#D1C3A5" opacity="0.6"/>
  <line x1="200" y1="210" x2="200" y2="185" stroke="#80541E" stroke-width="2" opacity="0.5"/>
  <polygon points="194,195 200,188 206,195" fill="#80541E" opacity="0.5"/>

  <!-- TORANA GATEWAY -->
  <g filter="url(#toranaShadow)">
    <!-- Base Plinths -->
    <rect x="120" y="330" width="36" height="20" rx="3" fill="#80541E"/>
    <rect x="244" y="330" width="36" height="20" rx="3" fill="#80541E"/>

    <!-- Left Pillar -->
    <rect x="126" y="160" width="24" height="172" fill="url(#sandstone3)" stroke="#663E10" stroke-width="1.2"/>
    <!-- Relief carving bands on left pillar -->
    <g stroke="#663E10" stroke-width="1" opacity="0.7">
      <line x1="126" y1="180" x2="150" y2="180"/>
      <line x1="126" y1="210" x2="150" y2="210"/>
      <line x1="126" y1="240" x2="150" y2="240"/>
      <line x1="126" y1="270" x2="150" y2="270"/>
      <line x1="126" y1="300" x2="150" y2="300"/>
      <circle cx="138" cy="195" r="4" fill="#663E10"/>
      <circle cx="138" cy="225" r="4" fill="#663E10"/>
      <circle cx="138" cy="255" r="4" fill="#663E10"/>
      <circle cx="138" cy="285" r="4" fill="#663E10"/>
      <circle cx="138" cy="315" r="4" fill="#663E10"/>
    </g>

    <!-- Right Pillar -->
    <rect x="250" y="160" width="24" height="172" fill="url(#sandstone3)" stroke="#663E10" stroke-width="1.2"/>
    <!-- Relief carving bands on right pillar -->
    <g stroke="#663E10" stroke-width="1" opacity="0.7">
      <line x1="250" y1="180" x2="274" y2="180"/>
      <line x1="250" y1="210" x2="274" y2="210"/>
      <line x1="250" y1="240" x2="274" y2="240"/>
      <line x1="250" y1="270" x2="274" y2="270"/>
      <line x1="250" y1="300" x2="274" y2="300"/>
      <circle cx="262" cy="195" r="4" fill="#663E10"/>
      <circle cx="262" cy="225" r="4" fill="#663E10"/>
      <circle cx="262" cy="255" r="4" fill="#663E10"/>
      <circle cx="262" cy="285" r="4" fill="#663E10"/>
      <circle cx="262" cy="315" r="4" fill="#663E10"/>
    </g>

    <!-- Elephant Capitals below lowest architrave -->
    <rect x="122" y="146" width="32" height="16" rx="4" fill="#9C6628" stroke="#663E10" stroke-width="1.2"/>
    <path d="M120 156 Q115 168 122 172" stroke="#663E10" stroke-width="2.5" fill="none"/>
    <rect x="246" y="146" width="32" height="16" rx="4" fill="#9C6628" stroke="#663E10" stroke-width="1.2"/>
    <path d="M280 156 Q285 168 278 172" stroke="#663E10" stroke-width="2.5" fill="none"/>

    <!-- Yakshi Bracket Figure (Right side under lowest architrave) -->
    <path d="M276 160 C290 170 300 185 292 205 C285 220 274 210 274 195 Z" 
          fill="#BA8741" stroke="#663E10" stroke-width="1.2"/>
    <circle cx="290" cy="172" r="5" fill="#BA8741"/>

    <!-- THREE ARCHITRAVES (HORIZONTAL BEAMS) -->
    <!-- Lowest Architrave -->
    <g transform="translate(0, 0)">
      <!-- Central curved beam -->
      <path d="M90 144 C150 140 250 140 310 144 L310 130 C250 126 150 126 90 130 Z" 
            fill="url(#sandstone3)" stroke="#663E10" stroke-width="1.2"/>
      <!-- Spiral end left -->
      <path d="M92 137 C80 137 72 144 75 152 C78 160 88 158 92 148" fill="#80541E" stroke="#663E10" stroke-width="1.2"/>
      <!-- Spiral end right -->
      <path d="M308 137 C320 137 328 144 325 152 C322 160 312 158 308 148" fill="#80541E" stroke="#663E10" stroke-width="1.2"/>
      <!-- Carved relief motifs -->
      <line x1="160" y1="137" x2="240" y2="137" stroke="#663E10" stroke-width="2" stroke-dasharray="3 3"/>
    </g>

    <!-- Vertical spacers between bottom & middle beams -->
    <rect x="132" y="112" width="12" height="16" fill="#9C6628"/>
    <rect x="194" y="112" width="12" height="16" fill="#9C6628"/>
    <rect x="256" y="112" width="12" height="16" fill="#9C6628"/>

    <!-- Middle Architrave -->
    <g transform="translate(0, -20)">
      <path d="M86 132 C150 128 250 128 314 132 L314 118 C250 114 150 114 86 118 Z" 
            fill="url(#sandstone3)" stroke="#663E10" stroke-width="1.2"/>
      <!-- Spiral ends -->
      <path d="M88 125 C75 125 68 132 71 140 C74 148 84 146 88 136" fill="#80541E" stroke="#663E10" stroke-width="1.2"/>
      <path d="M312 125 C325 125 332 132 329 140 C326 148 316 146 312 136" fill="#80541E" stroke="#663E10" stroke-width="1.2"/>
      <!-- Elephant / Peacock frieze dots -->
      <circle cx="160" cy="125" r="2.5" fill="#663E10"/>
      <circle cx="180" cy="125" r="2.5" fill="#663E10"/>
      <circle cx="200" cy="125" r="2.5" fill="#663E10"/>
      <circle cx="220" cy="125" r="2.5" fill="#663E10"/>
      <circle cx="240" cy="125" r="2.5" fill="#663E10"/>
    </g>

    <!-- Vertical spacers between middle & top beams -->
    <rect x="132" y="86" width="12" height="16" fill="#9C6628"/>
    <rect x="194" y="86" width="12" height="16" fill="#9C6628"/>
    <rect x="256" y="86" width="12" height="16" fill="#9C6628"/>

    <!-- Top Architrave -->
    <g transform="translate(0, -46)">
      <path d="M82 132 C150 128 250 128 318 132 L318 118 C250 114 150 114 82 118 Z" 
            fill="url(#sandstone3)" stroke="#663E10" stroke-width="1.2"/>
      <path d="M84 125 C70 125 62 132 65 140 C68 148 78 146 84 136" fill="#80541E" stroke="#663E10" stroke-width="1.2"/>
      <path d="M316 125 C330 125 338 132 335 140 C332 148 322 146 316 136" fill="#80541E" stroke="#663E10" stroke-width="1.2"/>
    </g>

    <!-- TOP FINIALS: Dharmachakra Wheel & Triratna Symbols -->
    <!-- Center Dharmachakra (Wheel of Law) -->
    <circle cx="200" cy="60" r="14" fill="#FAF6EF" stroke="#663E10" stroke-width="2.5"/>
    <circle cx="200" cy="60" r="4" fill="#663E10"/>
    <g stroke="#663E10" stroke-width="1.2">
      <line x1="200" y1="46" x2="200" y2="74"/>
      <line x1="186" y1="60" x2="214" y2="60"/>
      <line x1="190" y1="50" x2="210" y2="70"/>
      <line x1="190" y1="70" x2="210" y2="50"/>
    </g>

    <!-- Left & Right Triratna / Trident motifs -->
    <path d="M138 72 L138 60 Q138 52 134 50 Q138 56 138 60 Q138 52 142 50 Q138 56 138 60" 
          stroke="#663E10" stroke-width="2.5" fill="#BA8741"/>
    <path d="M262 72 L262 60 Q262 52 258 50 Q262 56 262 60 Q262 52 266 50 Q262 56 262 60" 
          stroke="#663E10" stroke-width="2.5" fill="#BA8741"/>
  </g>

  <!-- Era Label -->
  <text x="200" y="385" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#E0A23A" text-anchor="middle" letter-spacing="1.5">SANCHI STUPA · c. 1st CENTURY BCE</text>
</svg>
