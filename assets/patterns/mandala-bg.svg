    <path d="M201 201 C230 215 245 240 255 255 C240 245 215 230 201 201 Z" />
    <path d="M399 201 C370 215 355 240 345 255 C360 245 385 230 399 201 Z" />
    <path d="M201 399 C230 385 245 360 255 345 C240 355 215 370 201 399 Z" />
    <path d="M399 399 C370 385 355 360 345 345 C360 355 385 370 399 399 Z" />
